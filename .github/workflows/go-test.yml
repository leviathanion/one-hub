name: Go Test

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Race test websocket paths
        run: go test -race ./common/wsconn ./providers/openai ./providers/codex

      - name: Race test realtime relay actor
        run: go test -race ./relay -run '^TestRealtimeRelay'
